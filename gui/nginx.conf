server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router — unknown paths serve index.html (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend proxy routes ──────────────────────────────────────
    location /auth/ {
        proxy_pass http://auth-service:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mongo-api/ {
        proxy_pass http://mongo-api:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /generate-eflint {
        proxy_pass http://flint-to-eflint:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /execute {
        proxy_pass http://flint-to-eflint:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /repl {
        proxy_pass http://flint-to-eflint:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /eflint-server/ {
        proxy_pass http://eflint_server:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /git-service/ {
        proxy_pass http://git-service:8103/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
