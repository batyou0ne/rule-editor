apiVersion: 1

contactPoints:
  - orgId: 1
    name: Slack git-alerts
    receivers:
      - uid: slack-git-alerts
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          channel: "#git-alerts"
          title: |
            {{ if eq .Status "firing" }}🔴 ALERT{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}
          text: |
            {{ range .Alerts }}
            *Service:* {{ .Labels.job }}
            *Status:* {{ .Status }}
            *Summary:* {{ .Annotations.summary }}
            *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
            {{ end }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: Slack git-alerts
    group_by: ["alertname", "job"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 1h
