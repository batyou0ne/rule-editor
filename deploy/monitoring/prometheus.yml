global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: service-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      # severity=critical  → fires after 1 min down, Slack alert sent
      - targets:
          - https://rule-editor.nl/
          - http://auth-service:8001/health
        labels:
          severity: critical
      # severity=warning   → fires after 3 min down, Slack alert sent
      # To silence alerts for a specific service, move it to the "excluded" group below.
      - targets:
          - http://flint-to-eflint:8000/health
          - http://mongo-api:8002/health
          - http://git-service:8103/health
        labels:
          severity: warning
      # severity=excluded  → monitored (visible in Grafana) but never triggers an alert
      - targets: []
        labels:
          severity: excluded
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: mongodb-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - mongodb:27017
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
